[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serpuga-control"
version = "0.5.0"
description = "Kinematic NMPC prototype for a two-track reconfigurable robot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "casadi>=3.6",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
serpuga-demo = "serpuga_control.cli:main"

[tool.setuptools.packages.find]
include = ["serpuga_control*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
